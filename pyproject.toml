[project]
name = "learn-it"
version = "0.1.0"
description = "Interroge n'importe quel projet, comprends ses décisions techniques, améliore-les."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
learn-it = "learn_it.cli:app"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]
code = [
    "tree-sitter>=0.25.2,<0.27",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-typescript>=0.23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the tests import evals/
